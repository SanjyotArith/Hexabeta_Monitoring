targets:
  - name: "HexaBeta Backend API"
    endpoint: "http://localhost:8002/api/health"
    method: "GET"
    interval: 2
    timeout: 3
    validation:
      status_code: 200
      body_contains: "healthy"

incident:
  verification_attempts: 2
  verification_delay: 2

collectors:
  nginx:
    enabled: true
    binary_path: "/opt/homebrew/bin/nginx"
    config_path: "/opt/homebrew/etc/nginx/nginx.conf"
    error_log_path: "/opt/homebrew/var/log/nginx/error.log"
    access_log_path: "/opt/homebrew/var/log/nginx/access.log"
    log_lines: 50

  cloudflared:
    enabled: true
    tunnel_name: "mac-mini"
    config_path: "/Users/hexabeta/.cloudflared/config.yml"
    log_path: "/Users/hexabeta/.cloudflared/cloudflared.log"
    log_lines: 50

  uvicorn:
    enabled: true
    service_label: "com.hexa.backend"
    port: 8002
    expected_workers: 4

  postgres:
    enabled: false
    timeout: 5
    binary_path: "/opt/homebrew/bin/pg_isready"
    host: "localhost"
    port: 5432
    databases:
      - name: "loops_db"
        username: "hexa_user"
        password: ""
      - name: "wallet_db"
        username: "hexa_user"
        password: ""
    log_path: "/opt/homebrew/var/log/postgres.log"
    log_lines: 50

  redis:
    enabled: false
    timeout: 5
    binary_path: "/opt/homebrew/bin/redis-cli"
    host: "localhost"
    port: 6379
    username: ""
    password: ""
    log_path: "/opt/homebrew/var/log/redis.log"
    log_lines: 50

  system:
    enabled: false
    timeout: 5
    hostname_command: "hostname"
    os_version_command: "sw_vers"
    uptime_command: "uptime"
    cpu_command: "sysctl -n vm.loadavg"
    memory_command: "vm_stat"
    disk_command: "df -h"
    disk_path: "/"
    disk_threshold: 90

  launchctl:
    enabled: false
    timeout: 5
    services:
      - "com.hexa.backend"
      - "com.apple.Spotlight"
