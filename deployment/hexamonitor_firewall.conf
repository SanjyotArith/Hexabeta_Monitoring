# =========================================================
# HexaMonitor — pf Firewall Anchor Rules
# =========================================================
# Loaded as anchor "com.hexamonitor" in /etc/pf.conf
#
# Policy:
#   - Allow localhost (lo0) to reach TCP port 8000
#   - Allow GCP HexaAgent Tailscale IP (100.70.10.23) to reach TCP port 8000
#   - Block ALL other inbound traffic to TCP port 8000
#
# This does NOT touch any other ports or existing firewall rules.
# =========================================================

# Allow loopback traffic to port 8000
pass in quick on lo0 proto tcp from any to any port 8000

# Allow GCP HexaAgent over Tailscale
pass in quick proto tcp from 100.70.10.23 to any port 8000

# Block everything else to port 8000
block in quick proto tcp from any to any port 8000
